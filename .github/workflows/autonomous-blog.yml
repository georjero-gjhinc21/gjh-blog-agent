name: Autonomous Blog Generation

on:
  schedule:
    # Run Tuesday and Friday at 10 AM UTC (2-3 posts per week)
    - cron: '0 10 * * 2,5'
  workflow_dispatch:  # Allow manual triggering

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gjh_blog
          POSTGRES_USER: gjh_admin
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.1:8b

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
        run: |
          python main.py init || echo "Database already initialized"

      - name: Discover topics
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_HOST: http://localhost:11434
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
        run: |
          python main.py discover --max-topics 10

      - name: Generate blog post
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_HOST: http://localhost:11434
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
        run: |
          python main.py generate

      - name: Copy generated post to frontend
        run: |
          # Find the most recent post
          LATEST_POST=$(ls -t data/posts/*.md 2>/dev/null | head -1)
          if [ -f "$LATEST_POST" ]; then
            cp "$LATEST_POST" frontend/posts/
            echo "Copied: $LATEST_POST"
          else
            echo "No posts found to copy"
            exit 1
          fi

      - name: Commit new post
        run: |
          git config --local user.email "george@gjh-inc.com"
          git config --local user.name "GJH Blog Agent"
          git add frontend/posts/
          git diff --staged --quiet || git commit -m "🤖 Auto-generated blog post $(date +'%Y-%m-%d')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Trigger Vercel deployment
        if: success()
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" || echo "Vercel hook not configured"

      - name: Post statistics
        if: always()
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
        run: |
          python main.py stats
