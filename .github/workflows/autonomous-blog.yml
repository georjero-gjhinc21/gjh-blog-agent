name: Autonomous Blog Generation

on:
  schedule:
    # Run Tuesday and Friday at 10 AM UTC (2-3 posts per week)
    - cron: '0 10 * * 2,5'
  workflow_dispatch:  # Allow manual triggering

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Load secrets from Bitwarden
        uses: ./.github/actions/bitwarden-secrets
        with:
          bw_client_id: ${{ secrets.BW_CLIENT_ID }}
          bw_client_secret: ${{ secrets.BW_CLIENT_SECRET }}
          bw_password: ${{ secrets.BW_PASSWORD }}

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB=gjh_blog \
            -e POSTGRES_USER=gjh_admin \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            -p 5432:5432 \
            --health-cmd "pg_isready -U gjh_admin -d gjh_blog" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:16-alpine

          # Wait for PostgreSQL to be ready
          timeout 30 bash -c 'until docker exec postgres pg_isready -U gjh_admin; do sleep 1; done'
          echo "✓ PostgreSQL is ready"

      - name: Start Redis
        run: |
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:7-alpine

          # Wait for Redis to be ready
          timeout 30 bash -c 'until docker exec redis redis-cli ping | grep -q PONG; do sleep 1; done'
          echo "✓ Redis is ready"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.1:8b

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ env.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
        run: |
          python main.py init || echo "Database already initialized"

      - name: Discover topics
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ env.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_HOST: http://localhost:11434
          PARTNERSTACK_API_KEY: ${{ env.PARTNERSTACK_API_KEY }}
        run: |
          python main.py discover --max-topics 10

      - name: Generate blog post
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ env.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_HOST: http://localhost:11434
          PARTNERSTACK_API_KEY: ${{ env.PARTNERSTACK_API_KEY }}
        run: |
          python main.py generate

      - name: Copy generated post to frontend
        run: |
          # Find the most recent post
          LATEST_POST=$(ls -t data/posts/*.md 2>/dev/null | head -1)
          if [ -f "$LATEST_POST" ]; then
            cp "$LATEST_POST" frontend/posts/
            echo "Copied: $LATEST_POST"
          else
            echo "No posts found to copy"
            exit 1
          fi

      - name: Commit new post
        run: |
          git config --local user.email "george@gjh-inc.com"
          git config --local user.name "GJH Blog Agent"
          git add frontend/posts/
          git diff --staged --quiet || git commit -m "🤖 Auto-generated blog post $(date +'%Y-%m-%d')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Trigger Vercel deployment
        if: success()
        run: |
          curl -X POST "${{ env.VERCEL_DEPLOY_HOOK }}" || echo "Vercel hook not configured"

      - name: Post statistics
        if: always()
        env:
          DATABASE_URL: postgresql://gjh_admin:${{ env.POSTGRES_PASSWORD }}@localhost:5432/gjh_blog
          REDIS_URL: redis://localhost:6379/0
        run: |
          python main.py stats

      - name: Cleanup
        if: always()
        run: |
          docker stop postgres redis || true
          docker rm postgres redis || true
