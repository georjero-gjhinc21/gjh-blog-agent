version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gjh-blog-postgres
    environment:
      POSTGRES_DB: gjh_blog
      POSTGRES_USER: gjh_admin
      POSTGRES_PASSWORD: gjh_secure_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gjh_admin -d gjh_blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gjh-blog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build: .
    container_name: gjh-blog-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://gjh_admin:gjh_secure_password_2024@postgres:5432/gjh_blog
      - REDIS_URL=redis://redis:6379/0
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=https://integrate.api.nvidia.com/v1
      - NVIDIA_MODEL=meta/llama-3.1-8b-instruct

  celery-beat:
    build: .
    container_name: gjh-blog-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://gjh_admin:gjh_secure_password_2024@postgres:5432/gjh_blog
      - REDIS_URL=redis://redis:6379/0
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=https://integrate.api.nvidia.com/v1
      - NVIDIA_MODEL=meta/llama-3.1-8b-instruct

volumes:
  postgres_data:
  redis_data:
